version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5173:4173'
    depends_on:
      - backend
