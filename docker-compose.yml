FROM node:20-alpine

WORKDIR /app

COPY backend/package*.json ./backend/
COPY frontend/package*.json ./frontend/

RUN cd backend && npm install --omit=dev && cd ../frontend && npm install

COPY backend ./backend
COPY frontend ./frontend

RUN cd frontend && npm run build

EXPOSE 4000
CMD ["sh", "-lc", "cd backend && npm start & cd ../frontend && npm run preview -- --host 0.0.0.0 --port 4173"]
